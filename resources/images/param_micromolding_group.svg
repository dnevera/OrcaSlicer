<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- Micro-injection molding group icon: vertical pin with neck/head interlocking profile -->
  <rect x="0.5" y="0.5" width="16" height="16" rx="1" style="fill:none;stroke:#949494;stroke-linecap:round;stroke-linejoin:round"/>
  <!-- Syringe/injection nozzle (teal) -->
  <rect x="7" y="1.5" width="3" height="4" rx="0.5" style="fill:#009688;opacity:0.7"/>
  <line x1="8.5" y1="5.5" x2="8.5" y2="7" style="stroke:#009688;stroke-width:1.5;stroke-linecap:round"/>
  <!-- Interlocking cavity profile: neck-head-neck -->
  <!-- Layer lines (gray) -->
  <line x1="2" y1="7" x2="6.5" y2="7" style="stroke:#949494;stroke-width:0.6;opacity:0.5"/>
  <line x1="10.5" y1="7" x2="15" y2="7" style="stroke:#949494;stroke-width:0.6;opacity:0.5"/>
  <line x1="2" y1="10" x2="5.5" y2="10" style="stroke:#949494;stroke-width:0.6;opacity:0.5"/>
  <line x1="11.5" y1="10" x2="15" y2="10" style="stroke:#949494;stroke-width:0.6;opacity:0.5"/>
  <line x1="2" y1="13" x2="6.5" y2="13" style="stroke:#949494;stroke-width:0.6;opacity:0.5"/>
  <line x1="10.5" y1="13" x2="15" y2="13" style="stroke:#949494;stroke-width:0.6;opacity:0.5"/>
  <!-- Cavity shape: narrow neck + wide head (teal) -->
  <rect x="7" y="7" width="3" height="3" rx="0.3" style="fill:none;stroke:#009688;stroke-width:1"/>
  <rect x="5.5" y="10" width="6" height="3" rx="0.3" style="fill:none;stroke:#009688;stroke-width:1"/>
  <!-- Fill indicator -->
  <rect x="7.3" y="7.3" width="2.4" height="2.4" rx="0.2" style="fill:#009688;opacity:0.3"/>
  <rect x="5.8" y="10.3" width="5.4" height="2.4" rx="0.2" style="fill:#009688;opacity:0.3"/>
</svg>
